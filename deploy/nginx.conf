server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .db / .wasm / .js / .css 在镜像构建时已预压缩成 .gz
    gzip_static on;
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain application/json image/svg+xml;

    # 文件名带内容哈希，可以长期缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html 每次都重新校验，这样部署后立刻拿到新版本
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
