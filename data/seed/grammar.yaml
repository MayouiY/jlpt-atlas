# JLPT 语法考点词典（N1/N2 为主，含常作为选项出现的 N3 及以下基础句型、敬语、接续词、副词）。
# 字段：id 唯一标识（同时作为显示名，句型前自动加「〜」，lb 可覆盖显示名）
#       l 教材常见级别；c 类别代码（见 categories）；zh 中文释义；re 匹配正则（作用于去空格后的选项/片段）
#       b: true 表示过于基础/泛用，在台词、★题片段等长文本中不参与匹配
# 释义为本项目自行编写。
categories:
  time: 时间・时点
  cause: 原因・理由
  purpose: 目的・手段
  cond: 条件・假定
  concess: 逆接・让步
  add: 添加・并列・列举
  degree: 程度・极限
  limit: 限定・范围
  emph: 强调・举例
  compare: 比较・对比
  relation: 对象・关联・立场
  basis: 基准・依据
  judge: 推测・判断・断定
  emotion: 评价・感慨・情感
  state: 状态・倾向・样子
  will: 意志・愿望・决心
  must: 必要・义务・不可避免
  possible: 可能・难易
  neg: 否定・部分否定
  keigo: 敬语
  voice: 授受・使役・被动
  end: 文末表达・语气
  conj: 接续词
  demo: 指示词
  adv: 副词・呼应
items:
# ───────────── 时间・时点 ─────────────
